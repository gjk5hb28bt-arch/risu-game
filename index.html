function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);x=Math.min(Math.max(x||W/2,65),W-65)}window.addEventListener('resize',resize);resize();
function start(){resize();$('intro').style.display='none';$('over').style.display='none';playing=true;score=0;time=20;freeze=0;items=[];particles=[];spawn=0;last=0;face=0;$('score').textContent=0;$('time').textContent=20;x=W/2;requestAnimationFrame(loop)}

function control(el,v){const b=$(el);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);move=v;dir=v});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(move===v)move=0})}control('left',-1);control('right',1);window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){move=-1;dir=-1}else if(e.key==='ArrowRight'){move=1;dir=1}});window.addEventListener('keyup',()=>move=0);
function acorn(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle);const gold=o.type==='gold',s=o.r;ctx.shadowColor=gold?'#ffed40':'#573010';ctx.shadowBlur=gold?20:2;ctx.fillStyle=gold?'#ffce24':'#a84f19';ctx.strokeStyle=gold?'#fff2a0':'#613015';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,s*.13,s*.67,s*.9,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=gold?'#fff09b':'#753b18';ctx.beginPath();ctx.ellipse(0,-s*.46,s*.82,s*.38,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,-s*.77);ctx.lineTo(s*.12,-s);ctx.stroke();ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.ellipse(-s*.26,s*.05,s*.12,s*.33,-.4,0,7);ctx.fill();if(gold){ctx.fillStyle='#fff8b0';for(let j=0;j<4;j++){let a=j*Math.PI/2+anim*.9;ctx.fillRect(Math.cos(a)*s*1.25-2,Math.sin(a)*s*1.25-2,5,5)}}ctx.restore()}
function burr(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(anim*.7);let s=o.r;ctx.fillStyle='#101015';ctx.strokeStyle='#35313c';ctx.lineWidth=2;ctx.beginPath();for(let j=0;j<40;j++){let a=j*Math.PI/20,rad=j%2?s*.78:s*1.18;let xx=Math.cos(a)*rad,yy=Math.sin(a)*rad;j?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='white';for(let a of [-.33,.33]){ctx.beginPath();ctx.ellipse(a*s,-s*.07,s*.25,s*.31,0,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(a*s+s*.05,0,s*.11,0,7);ctx.fill();ctx.fillStyle='white'}ctx.restore()}
function background(){if(imgs.forest.complete&&imgs.forest.naturalWidth){let im=imgs.forest;let scale=Math.max(W/im.width,H/im.height);let iw=im.width*scale,ih=im.height*scale;ctx.drawImage(im,(W-iw)/2,(H-ih)/2,iw,ih)}else{ctx.fillStyle='#68b88b';ctx.fillRect(0,0,W,H)}ctx.fillStyle='#4c8c38';ctx.fillRect(0,H*.83,W,H*.17);ctx.fillStyle='#6bb54d';ctx.fillRect(0,H*.84,W,7)}
function squirrel(){let sw=Math.min(W*.48,210),sh=sw*203/238;let cy=H*.83;ctx.save();ctx.translate(x,cy);ctx.scale(dir,1);let bounce=freeze>0?0:Math.abs(move)>0?Math.sin(anim*17)*4:Math.sin(anim*3)*1.6;ctx.translate(0,bounce);ctx.fillStyle='#132c18aa';ctx.beginPath();ctx.ellipse(0,3,sw*.38,9,0,0,7);ctx.fill();if(imgs.risu.complete&&imgs.risu.naturalWidth)ctx.drawImage(imgs.risu,-sw/2,-sh,sw,sh);else{ctx.font='110px serif';ctx.fillText('🐿️',-60,-30)}if(freeze>0){ctx.fillStyle='#fff0d5cc';ctx.beginPath();ctx.ellipse(sw*.16,-sh*.55,sw*.16,sh*.13,0,0,7);ctx.fill();ctx.fillStyle='#56351c';ctx.lineWidth=3;for(let a of [-1,1]){let ex=sw*.16+a*sw*.07,ey=-sh*.58;ctx.beginPath();ctx.moveTo(ex-7,ey-3);ctx.lineTo(ex,ey+4);ctx.lineTo(ex+7,ey-3);ctx.stroke()}ctx.font='bold 17px sans-serif';ctx.fillText('いたた…',-35,-sh-10);ctx.font='25px sans-serif';ctx.fillText('💫',sw*.24,-sh*.83)}ctx.restore()}
function burst(px,py,gold){for(let i=0;i<9;i++)particles.push({x:px,y:py,vx:rnd(-90,90),vy:rnd(-130,15),life:.55,col:gold?'#ffe45a':'#fff5b9'})}
function loop(ts){if(!playing)return;if(!last)last=ts;let dt=Math.min((ts-last)/1000,.04);last=ts;anim+=dt;time=Math.max(0,time-dt);$('time').textContent=Math.ceil(time);freeze=Math.max(0,freeze-dt);if(freeze===0&&move)x=Math.max(48,Math.min(W-48,x+move*W*.72*dt));spawn-=dt;if(spawn<=0){let type=Math.random()<.15?'burr':Math.random()<.22?'gold':'normal';let r=type==='gold'?23:type==='burr'?22:17;items.push({x:rnd(35,W-35),y:-35,r,type,speed:rnd(H*.28,H*.41),angle:rnd(-.2,.2)});spawn=rnd(.32,.58)}background();for(let i=items.length-1;i>=0;i--){let o=items[i];o.y+=o.speed*dt;if(o.type==='burr')burr(o);else acorn(o);let catchY=H*.83-Math.min(W*.48,210)*203/238*.91;let near=Math.abs(o.x-x)<Math.min(W*.48,210)*.39;if(near&&o.y>catchY-15&&o.y<catchY+23){if(o.type==='burr'){freeze=3;face=3}else{let pts=o.type==='gold'?10:1;score+=pts;$('score').textContent=score;burst(o.x,o.y,pts===10)}items.splice(i,1)}else if(o.y>H+40)items.splice(i,1)}squirrel();for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=230*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/.55);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();ctx.globalAlpha=1;if(p.life<=0)particles.splice(i,1)}if(time<=0){playing=false;move=0;let best=0;try{best=Number(localStorage.getItem('risu-best')||0);if(score>best){best=score;localStorage.setItem('risu-best',best)}}catch(e){best=score}$('final').textContent=score;$('best').textContent=best;$('over').style.display='flex';return}requestAnimationFrame(loop)}background();squirrel();
