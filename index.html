function basket(){return{x:x+dir*43,y:H-124,w:51,h:26}}function squirrel(){let y=H-89,bob=(mode==='playing'&&freeze<=0&&Math.abs(held)>0)?Math.sin(motion*13)*3:0;ctx.save();ctx.translate(x,y+bob);if(freeze>0)ctx.rotate(Math.sin(motion*12)*.035);let leg=Math.sin(motion*13)*11;oval(-dir*28,-17,39,44,'#ad632e',-dir*.5);oval(-dir*33,-17,27,32,'#f3c985',-dir*.5);oval(-dir*38,-15,18,23,'#bd793d');oval(0,4,25,32,'#bc793d');oval(0,8,17,23,'#ffdfa3');path([[-11,23],[-14+leg,34]],'#925025',12);path([[11,23],[14-leg,34]],'#925025',12);oval(-14+leg,35,10,5,'#e5aa64');oval(14-leg,35,10,5,'#e5aa64');circ(-20,-54,16,'#a95f2e');circ(20,-54,16,'#a95f2e');circ(-20,-54,10,'#f6b7a4');circ(20,-54,10,'#f6b7a4');oval(0,-36,36,32,'#b96e32');oval(0,-25,26,18,'#ffe0a5');oval(-15,-39,11,15,'#fff');oval(15,-39,11,15,'#fff');oval(-15,-39,8,12,'#3a221b');oval(15,-39,8,12,'#3a221b');circ(-18,-44,3.5,'#fff');circ(12,-44,3.5,'#fff');circ(-12,-36,2,'#fff');circ(18,-36,2,'#fff');oval(0,-22,5,3,'#72452d');oval(-26,-21,7,4,'#f9a6a0');oval(26,-21,7,4,'#f9a6a0');ctx.beginPath();ctx.arc(0,-20,8,.1,Math.PI-.1);stroke('#9b452c',2.5);
// Basket and arms are rendered on the moving side; the opening is the collision target.
let bx=dir*43,by=-35;path([[dir*12,-8],[dir*27,-20],[bx-dir*18,by+3]],'#a75c2b',12);oval(bx,by+11,26,21,'#9a562b');oval(bx,by+8,25,18,'#d99849');for(let k=-2;k<=2;k++)path([[bx+k*8,by+3],[bx+k*8,by+23]],'#a76b30',1.7);for(let k=0;k<3;k++)path([[bx-22,by+6+k*7],[bx+22,by+6+k*7]],'#f0c27c',2);oval(bx,by,27,8,'#79451f');oval(bx,by-3,27,8,'#eac080');oval(bx,by-4,21,4,'#71421f');circ(bx-dir*20,by+3,7,'#f0bb7b');ctx.restore();if(freeze>0)txt('💫',x,H-170,24)}
function acorn(a,b,gold){ctx.save();ctx.translate(a,b);if(gold){ctx.shadowBlur=22;ctx.shadowColor='#ffe552';ctx.scale(1.28,1.28)}oval(0,3,13,17,gold?'#ffd335':'#b87942');oval(-4,0,5,9,gold?'#fff6a4':'#e7b17b');oval(0,-9,15,8,gold?'#e9a920':'#784621');oval(0,-16,3,5,'#7b5429');if(gold){ctx.shadowBlur=0;txt('✦',20,-10,14,'#fff8ad');txt('✧',-19,13,13,'#fff8ad')}ctx.restore()}
function burr(a,b){ctx.save();ctx.translate(a,b);ctx.beginPath();for(let i=0;i<48;i++){let t=i*Math.PI/24,r=i%2?14:24;if(i===0)ctx.moveTo(Math.cos(t)*r,Math.sin(t)*r);else ctx.lineTo(Math.cos(t)*r,Math.sin(t)*r)}ctx.closePath();ctx.fillStyle='#15161b';ctx.fill();circ(0,0,14,'#292a30');oval(-6,-2,4,5,'#fff');oval(6,-2,4,5,'#fff');circ(-5,-1,2,'#18171a');circ(7,-1,2,'#18171a');path([[-10,-10],[-3,-7]],'#111',2);path([[3,-7],[10,-10]],'#111',2);ctx.restore()}
function burst(a,b,color){for(let i=0;i<12;i++)fx.push({x:a,y:b,vx:(Math.random()-.5)*220,vy:-Math.random()*160,life:.5,color})}function add(){let r=Math.random(),type=r<.13?'burr':r<.26?'gold':'normal';items.push({x:25+Math.random()*(W-50),y:-35,vy:170+Math.random()*65+elapsed*2,type,r:type==='burr'?20:type==='gold'?22:16})}
function hud(){timeEl.textContent=Math.ceil(time);scoreEl.textContent=score;bestEl.textContent=best}function start(){mode='playing';time=20;score=0;elapsed=0;spawn=.25;freeze=0;items=[];fx=[];x=W/2;dir=1;held=0;aim=null;overlay.classList.add('hidden');statusEl.textContent='🌰 カゴでどんぐりをキャッチ！';hud()}function finish(){mode='over';held=0;aim=null;if(score>best){best=score;try{localStorage.setItem('risu-best-20sec-v2',String(best))}catch(e){}}hud();panelTitle.textContent=score>=60?'🎉 大収穫！':'🐿️ おつかれさま！';panelText.textContent='20秒間のスコアは…';result.textContent=score+' 点';result.classList.remove('hidden');startBtn.textContent='もういちど遊ぶ';overlay.classList.remove('hidden')}
function pause(){if(mode==='playing'){mode='paused';held=0;panelTitle.textContent='⏸ 一時停止';panelText.textContent='準備ができたら再開してね';result.classList.add('hidden');startBtn.textContent='▶ 再開する';overlay.classList.remove('hidden')}else if(mode==='paused'){mode='playing';overlay.classList.add('hidden')}}startBtn.addEventListener('click',()=>mode==='paused'?pause():start());pauseBtn.addEventListener('click',pause);
for(const [id,v] of [['left',-1],['right',1]]){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();if(mode!=='playing')return;held=v;dir=v;aim=null;el.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>{if(held===v)held=0})}canvas.addEventListener('pointerdown',e=>{if(mode!=='playing')return;let r=canvas.getBoundingClientRect();aim=(e.clientX-r.left)*W/r.width;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(mode==='playing'&&e.buttons){let r=canvas.getBoundingClientRect();aim=(e.clientX-r.left)*W/r.width}});canvas.addEventListener('pointerup',()=>aim=null);window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){held=e.key==='ArrowLeft'?-1:1;dir=held;e.preventDefault()}});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')held=0});
function loop(ts){if(!last)last=ts;let dt=Math.min(.05,(ts-last)/1000);last=ts;motion+=dt;if(mode==='playing'){time-=dt;elapsed+=dt;if(time<=0){time=0;finish()}else{if(freeze>0){freeze=Math.max(0,freeze-dt);statusEl.textContent=freeze>0?'💫 あと'+Math.ceil(freeze)+'秒動けない！':'🌰 復活！';}else{let dx=held*260*dt;if(aim!==null){dx=Math.max(-260*dt,Math.min(260*dt,aim-x));if(Math.abs(dx)>1)dir=dx>0?1:-1}x=Math.max(72,Math.min(W-72,x+dx))}spawn-=dt;if(spawn<=0){add();spawn=.3+Math.random()*.28}let b=basket();for(let i=items.length-1;i>=0;i--){let o=items[i];let prev=o.y;o.y+=o.vy*dt;let hit=o.type==='burr'?Math.abs(o.x-b.x)<b.w*.65+o.r*.6&&prev-o.r<b.y+10&&o.y+o.r>b.y-16:Math.abs(o.x-b.x)<b.w*.67+o.r*.35&&prev-o.r<b.y+9&&o.y+o.r>b.y-12;if(hit){if(o.type==='burr'){if(freeze<=0){freeze=3;statusEl.textContent='⚫ イガグリ！3秒ストップ';burst(o.x,o.y,'#333')}}else{let p=o.type==='gold'?10:1;score+=p;statusEl.textContent=o.type==='gold'?'✨ 金のどんぐり ＋10点！':'🌰 ＋1点！';burst(b.x,b.y,o.type==='gold'?'#ffe35e':'#ffe5a2')}items.splice(i,1);hud()}else if(o.y>H+30)items.splice(i,1)}for(let i=fx.length-1;i>=0;i--){let p=fx[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.life-=dt;if(p.life<=0)fx.splice(i,1)}}hud()}
ctx.clearRect(0,0,W,H);let gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,'#d8f5d022');gradient.addColorStop(.75,'#d8edc800');gradient.addColorStop(1,'#638c4055');ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);for(let o of items)o.type==='burr'?burr(o.x,o.y):acorn(o.x,o.y,o.type==='gold');squirrel();for(let p of fx){ctx.globalAlpha=Math.max(0,p.life/.5);circ(p.x,p.y,3.5,p.color)}ctx.globalAlpha=1;requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
